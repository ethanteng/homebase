<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171a19" />
    <title>Homebase — Turn your computer into your personal cloud.</title>
    <meta
      name="description"
      content="Turn your computer into your personal cloud. Start with your files, on your Mac or a drive you own. Get early access to Homebase."
    />
    <meta
      property="og:title"
      content="Homebase — Turn your computer into your personal cloud."
    />
    <meta
      property="og:description"
      content="Start with your files. Keep them on your Mac or a drive you own."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./homebase.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Homebase home"
          ><img src="./homebase.svg" width="32" height="32" alt="" />homebase</a
        >
        <span class="stage">Starting with Mac</span>
      </header>
      <main class="hero" id="main">
        <div class="hero-content">
          <h1>
            Turn your computer<br />into your <span>personal cloud.</span>
          </h1>
          <p class="description">
            Start with your files. Keep them on your Mac<br
              class="desktop-break"
            />
            or a drive you own.
          </p>
          <div class="access-action">
            <button
              class="primary-link"
              type="button"
              aria-describedby="access-note"
              disabled
            >
              Get early access <span aria-hidden="true">↗</span>
            </button>
            <p id="access-note">Invitations open soon.</p>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
