      content="Turn any computer you own into private storage for your household. Stop paying for Dropbox, Evernote, and Google Drive."

    <meta
      property="og:title"
      content="Uncloud — Stop paying for Dropbox, Evernote, and Google Drive."
    />
    <meta
      property="og:description"
      content="Turn any computer you own into private storage for your household. Stop paying for Dropbox, Evernote, and Google Drive."
    />

    <meta property="og:site_name" content="Uncloud" />

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Uncloud home"
          ><img src="./uncloud.svg" width="32" height="32" alt="" />Uncloud</a
        >
        <span class="site-domain">uncloud.life</span>
      </header>
      <main class="hero" id="main">
        <div class="hero-content">
          <h1>
            <span class="headline-line">Stop paying for</span>
            <span class="service-rotation" aria-hidden="true">
              <span class="service-name is-active">Dropbox.</span>
              <span class="service-name">Evernote.</span>
              <span class="service-name">Google Drive.</span>
            </span>
            <span class="sr-only">Dropbox, Evernote, or Google Drive.</span>
          </h1>
          <div class="migration-details">
            <p class="migration-intro">
              Your digital life belongs
              <span class="headline-accent">at home.</span>
            </p>
            <p class="computer-description">
              Turn <mark>any</mark> computer you own into
              <span class="storage-accent">private storage</span> for your
              household.
            </p>
          </div>
          <div class="access-action">
            <button class="primary-link" type="button" disabled>
              Get early access
            </button>
            <p class="trust-note">Private. Secure. Yours.</p>
            <div class="platforms" role="group" aria-label="Platforms">
              <span class="platform">
                <svg viewBox="0 0 24 24" width="33" height="33" fill="currentColor" aria-hidden="true" focusable="false">

                </svg>
                Mac
              </span>
              <span class="platform">
                <svg viewBox="0 0 24 24" width="33" height="33" fill="currentColor" aria-hidden="true" focusable="false">
                  <path d="m2 4.6 8.2-1.1v7.7H2V4.6Zm9.8-1.3L22 1.8v9.4H11.8V3.3ZM2 12.8h8.2v7.7L2 19.4v-6.6Zm9.8 0H22v9.4l-10.2-1.5v-7.9Z" />
                </svg>
                PC
              </span>
              <span class="platform">
                <svg viewBox="0 0 24 24" width="33" height="33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M8 8V6a4 4 0 0 1 8 0v2c0 3 3.5 5.3 3.5 8.5M8 8c0 3-3.5 5.3-3.5 8.5" />
                  <path d="M9 11c-1.2 1.6-2 3.7-2 5.5A5 5 0 0 0 12 21a5 5 0 0 0 5-4.5c0-1.8-.8-3.9-2-5.5M9.5 9l2.5-1 2.5 1-2.5 2-2.5-2Z" />
                  <path d="m7 17-4 2 1 2 5-1m8-3 4 2-1 2-5-1" />
                  <circle cx="10.5" cy="6.5" r=".75" fill="currentColor" stroke="none" />
                  <circle cx="13.5" cy="6.5" r=".75" fill="currentColor" stroke="none" />
                </svg>
                Linux
              </span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
