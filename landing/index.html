<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171a19" />
    <title>Uncloud — Stop paying for Dropbox, Evernote, and Google Drive.</title>
    <meta
      name="description"
      content="Turn any computer you own into private storage for your household. Stop paying for Dropbox, Evernote, and Google Drive."
    />
    <meta
      property="og:title"
      content="Uncloud — Stop paying for Dropbox, Evernote, and Google Drive."
    />
    <meta
      property="og:description"
      content="Turn any computer you own into private storage for your household. Stop paying for Dropbox, Evernote, and Google Drive."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Uncloud" />
    <meta property="og:url" content="https://uncloud.life/" />
    <link rel="canonical" href="https://uncloud.life/" />
    <link rel="icon" type="image/svg+xml" href="./uncloud.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="site-header">
        <a class="wordmark" href="./" aria-label="Uncloud home"
          ><img src="./uncloud.svg" width="32" height="32" alt="" />Uncloud</a
        >
        <span class="site-domain">uncloud.life</span>
      </header>
      <main class="hero" id="main">
        <div class="hero-content">
          <h1>
            <span class="headline-line">Stop paying for</span>
            <span class="service-rotation" aria-hidden="true">
              <span class="service-name is-active">Dropbox.</span>
              <span class="service-name">Evernote.</span>
              <span class="service-name">Google Drive.</span>
            </span>
            <span class="sr-only">Dropbox, Evernote, or Google Drive.</span>
          </h1>
          <div class="migration-details">
            <p class="migration-intro">
              Your digital life belongs
              <span class="headline-accent">at home.</span>
            </p>
            <p class="computer-description">
              Turn <mark>any</mark> computer you own into
              <span class="storage-accent">private storage</span> for your
              household.
            </p>
          </div>
          <div class="access-action">
            <button class="primary-link" type="button" disabled>
              Get early access
            </button>
            <p class="trust-note">Private. Secure. Yours.</p>
          </div>
        </div>
      </main>
    </div>
  </body>
