name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes an in-flight run. On main, runs queue instead: a
# cancelled run could stop the publish job half way through replacing the download.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is the target platform; Linux catches path assumptions early.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/homebase-web/package-lock.json

      # The tunnel Uncloud ships is Go. tailscale.com pins a newer toolchain than this,
      # which GOTOOLCHAIN=auto fetches rather than failing on.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/uncloud-tunnel/go.sum

      # Builds and type-checks the frontend, then runs the backend integration
      # tests: the same script a contributor runs locally.
      - run: ./scripts/check.sh

      # The scripts that run as root on somebody's Mac, and the one that tries them for real.
      - if: runner.os == 'Linux'
        run: shellcheck scripts/macos-host/uncloud-host.sh scripts/smoke-macos-host.sh

      # The Syncthing Uncloud ships is a pinned release checked against a pinned SHA-256. Fetching
      # it here means a pin that no longer matches fails a pull request, not somebody's install.
      - run: ./scripts/fetch-syncthing.sh "$RUNNER_TEMP/syncthing" && "$RUNNER_TEMP/syncthing/syncthing" --version

  # The Mac app: the menu-bar app with the server, Syncthing and the tunnel inside it, for Apple
  # Silicon and Intel. Built on a Mac because only a Mac can make the icon and sign it.
  app:
    name: app (${{ matrix.runtime }})
    runs-on: macos-latest
    # Signing takes under a minute; notarizing is Apple's queue, which took 24 and 40 minutes for
    # the first two submissions. Timing out only means main keeps the previous download, but a
    # build Apple would have accepted shouldn't be thrown away for waiting.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/homebase-web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/uncloud-tunnel/go.sum

      # Signed with the Developer ID and notarized by Apple, so macOS opens it without anybody
      # allowing it in System Settings first. That's every build that can be published, and runs
      # started by hand, which is how a change to signing gets tried on a branch. Pull requests
      # build ad hoc: they never publish, and notarizing every push would only slow them down.
      # Without the secrets this fails, rather than main publishing an app macOS stops.
      - name: Set up the Developer ID
        if: github.event_name != 'pull_request'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for secret in CERTIFICATE CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Signing needs the MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER_ID secrets. See docs/technical.md."
              exit 1
            fi
          done
          # A keychain of its own for this run, which codesign can use without asking anybody.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Apple's Developer ID intermediate, which a certificate exported from Keychain Access
          # doesn't usually carry and without which it isn't a valid identity. If the export did
          # carry it, it's already there; either way the identity is checked below.
          curl -fsSL --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one path per word, and none has a space
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: /{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12 has no valid Developer ID Application certificate with its private key. This is what it has:"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "UNCLOUD_SIGN_IDENTITY=$identity"
            echo "UNCLOUD_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "UNCLOUD_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "UNCLOUD_NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - run: ./scripts/package-macos-app.sh ${{ matrix.runtime }}

      # Opens the app it just built, as somebody would, and fails if it doesn't stay open or can't
      # start the server it carries. The Intel build runs under Rosetta.
      - run: ./scripts/smoke-macos-app.sh artifacts/app-${{ matrix.runtime }}/Uncloud.app

      # Then as a host for real: the app's one-time setup, which macOS runs as root through its
      # password prompt, run here with CI's passwordless sudo. It checks that everybody's files
      # belong to Uncloud's own account and that the person signed in at the Mac can't list them —
      # moved across from a host that ran as that person, read from a drive, and turned off.
      - run: ./scripts/smoke-macos-host.sh artifacts/app-${{ matrix.runtime }}/Uncloud.app

      - uses: actions/upload-artifact@v4
        with:
          name: Uncloud-${{ matrix.runtime }}
          path: artifacts/Uncloud-${{ matrix.runtime }}.dmg
          retention-days: 14

  # What the README links to: every build of main, published as the "mac-latest" release so the
  # download address never changes. Only after the checks and both apps pass, and never from a
  # pull request.
  publish:
    name: publish Mac app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Uncloud-osx-*
          merge-multiple: true
          path: dist

      - name: Update the mac-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="The Uncloud app for Mac, built from ${GITHUB_SHA::7} on main.

          - **Uncloud-osx-arm64.dmg**: Macs with Apple silicon (M1 and later).
          - **Uncloud-osx-x64.dmg**: Macs with an Intel processor.

          Open it and drag Uncloud onto Applications. It's signed and notarized by Apple: the first time you open it, macOS asks whether you're sure, and you click Open."
          if ! gh release view mac-latest >/dev/null 2>&1; then
            gh release create mac-latest dist/Uncloud-osx-arm64.dmg dist/Uncloud-osx-x64.dmg \
              --target "$GITHUB_SHA" --title "Uncloud for Mac (latest)" --notes "$notes"
            exit 0
          fi
          # Never deleted and made again: the release stays up throughout, and if anything below
          # fails part way, the previous build is still what people download.
          gh release upload mac-latest dist/Uncloud-osx-arm64.dmg dist/Uncloud-osx-x64.dmg --clobber
          # The app was first published as zips. Once the disk images are up, those go, so an old
          # link fails rather than handing somebody an old build.
          gh release view mac-latest --json assets --jq '.assets[].name | select(endswith(".zip"))' |
            while read -r old; do gh release delete-asset mac-latest "$old" --yes; done
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/mac-latest" -f sha="$GITHUB_SHA" -F force=true
          gh release edit mac-latest --notes "$notes"
