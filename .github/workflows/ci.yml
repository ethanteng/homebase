name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is the target platform; Linux catches path assumptions early.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/homebase-web/package-lock.json

      # The tunnel Uncloud ships is Go. tailscale.com pins a newer toolchain than this,
      # which GOTOOLCHAIN=auto fetches rather than failing on.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/uncloud-tunnel/go.sum

      # Builds and type-checks the frontend, then runs the backend integration
      # tests: the same script a contributor runs locally.
      - run: ./scripts/check.sh

      # The Syncthing Uncloud ships is a pinned release checked against a pinned SHA-256. Fetching
      # it here means a pin that no longer matches fails a pull request, not somebody's install.
      - run: ./scripts/fetch-syncthing.sh "$RUNNER_TEMP/syncthing" && "$RUNNER_TEMP/syncthing/syncthing" --version

  # The Mac app: the menu-bar app with the server, Syncthing and the tunnel inside it, for Apple
  # Silicon and Intel. Built on a Mac because only a Mac can make the icon and sign it; signed ad
  # hoc until there is a Developer ID, so macOS asks people to confirm it the first time.
  app:
    name: app (${{ matrix.runtime }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/homebase-web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/uncloud-tunnel/go.sum

      - run: ./scripts/package-macos-app.sh ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: Uncloud-${{ matrix.runtime }}
          path: artifacts/Uncloud-${{ matrix.runtime }}.zip
          retention-days: 14

  # What the README links to: every build of main, published as the "mac-latest" release so the
  # download address never changes. Only after the checks and both apps pass, and never from a
  # pull request.
  publish:
    name: publish Mac app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Uncloud-osx-*
          merge-multiple: true
          path: dist

      - name: Replace the mac-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Deleted and made again, so the tag moves to this commit and nothing stale is left.
          gh release delete mac-latest --cleanup-tag --yes || true
          gh release create mac-latest dist/Uncloud-osx-arm64.zip dist/Uncloud-osx-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Uncloud for Mac (latest)" \
            --notes "The Uncloud app for Mac, built from ${GITHUB_SHA::7} on main.

          - **Uncloud-osx-arm64.zip**: Macs with Apple silicon (M1 and later).
          - **Uncloud-osx-x64.zip**: Macs with an Intel processor.

          It isn't signed by Apple yet, so macOS asks you to confirm it the first time you open it. See the README for how."
